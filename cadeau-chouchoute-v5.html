<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Une surprise pour toi, Chouchoute</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@300;400;600&display=swap">
<style>
:root{--bg:#0b0b0d;--card:#16151a;--pink:#ff4d9d;--gold:#d9b36c;--txt:#f4efe9;--mut:#a79fa6;--line:#3a333d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-weight:300}
body{background:radial-gradient(ellipse at 50% -10%,#3a1030 0,transparent 55%),radial-gradient(ellipse at 50% 110%,#2b2008 0,transparent 50%),var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#app{width:100%;max-width:520px;text-align:center}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:600;margin:0 0 12px;line-height:1.2}
h1{font-size:clamp(2rem,8vw,2.8rem);color:var(--gold)}
h2{font-size:1.5rem}
.pink{color:var(--pink);font-style:italic}
p{line-height:1.6;margin:0 0 16px}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid #2c2530;border-radius:18px;padding:26px 22px;box-shadow:0 10px 40px #0008;animation:in .6s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
button{font:inherit;cursor:pointer;color:var(--txt);background:transparent;border:1px solid var(--line);border-radius:999px;padding:13px 22px;margin:6px 0;width:100%;transition:.2s;-webkit-tap-highlight-color:transparent}
@media (hover:hover){button:hover{border-color:var(--pink)}}
button.main{background:linear-gradient(135deg,var(--pink),#c2185b);border:0;font-weight:600;width:auto;padding:14px 34px;box-shadow:0 6px 24px #ff4d9d55}
button.ok{border-color:var(--pink);background:#ff4d9d22}
button.ko{animation:sh .4s;border-color:var(--line);color:var(--mut)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--pink)}
.q{font-size:1.2rem;line-height:1.5;color:var(--txt);font-weight:400;margin:14px 0 20px}
.fb{min-height:1.6em;color:var(--pink);font-size:.95rem;margin-top:8px}
.gift{font-size:6rem;cursor:pointer;display:inline-block;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 0 22px #ff4d9d88);background:none;border:0;width:auto;padding:0}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.cd{display:flex;gap:8px;justify-content:center;margin:18px 0}
.cd div{flex:1;background:#0b0b0d;border:1px solid #2c2530;border-radius:12px;padding:10px 4px}
.cd b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.7rem;color:var(--gold)}
.cd span{font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.ticket{border:1px dashed var(--gold);border-radius:14px;padding:16px;margin:18px 0;background:#d9b36c11}
.ticket strong{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.35rem;color:var(--gold);margin-bottom:4px}
.scr{position:relative;width:100%;height:300px;border-radius:14px;overflow:hidden;border:1px solid #2c2530;touch-action:none;margin-bottom:6px}
.scr svg,.scr canvas{position:absolute;inset:0;width:100%;height:100%}
.scr canvas{transition:opacity .8s}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}
.grid button{aspect-ratio:1;padding:0;margin:0;border-radius:14px;font-size:1.7rem;background:#0b0b0d;color:var(--gold)}
.grid button.up{border-color:var(--pink);background:#ff4d9d22}
.grid button.f{border-color:var(--gold);background:#d9b36c22;opacity:.8}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.ghost{width:auto;border:0;color:var(--mut);font-size:.85rem;padding:8px 6px;margin:0}
canvas#cv{position:fixed;inset:0;pointer-events:none;z-index:9;width:100%;height:100%}
</style>
</head>

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function head(){
  var d="";for(var i=0;i<E.length;i++)d+='<i class="'+(i<=step?"on":"")+'"></i>';
  return '<div class="dots">'+d+'</div><h2>Énigme <span class="pink">'+(step+1)+'</span> sur '+E.length+'</h2><p class="q">'+E[step].q+'</p>';

var token=0;
function done(msg){
  document.getElementById("fb").textContent=msg;var t=token;
  var fb=document.getElementById("fb");
  fb.insertAdjacentHTML("afterend",'<button class="main" id="nx" style="margin-top:14px">Suivant →</button>');
  document.getElementById("nx").onclick=function(){if(t!==token)return;step++;step<E.length?run():clock();};
}

  document.getElementById("bk").onclick=back;

}
function intro(){
  token++;clearInterval(timer);
  app.innerHTML='<div class="card"><h1>'+NOM+'…</h1><p>J’ai une surprise pour toi.<br>Pour la découvrir, il faudra résoudre <b>5 énigmes</b>. Pas de triche, pas de spoilers, et surtout pas de panique.</p><p class="mut">Prête ?</p><button class="main" id="go">Je suis prête</button></div>';
  document.getElementById("go").onclick=function(){step=0;run();};
}
function run(){
  token++;clearInterval(timer);var e=E[step];
  ({choice:choice,memo:memo,scratch:scratch})[e.t](e);
  nav(function(){if(step>0){step--;run();}else intro();});
}

function choice(e){
  app.innerHTML='<div class="card">'+head()+'<div id="opts"></div><div class="fb" id="fb"></div></div>';
  var box=document.getElementById("opts"),fb=document.getElementById("fb");
  shuffle(e.o).forEach(function(o){
    var b=document.createElement("button");b.textContent=o.t;
    b.onclick=function(){
      if(o.r){
        b.className="ok";
        Array.prototype.forEach.call(box.children,function(x){x.disabled=true;});
        done(o.m);

        fb.textContent=o.m;b.className="";void b.offsetWidth;b.className="ko";

function memo(e){
  app.innerHTML='<div class="card">'+head()+'<div class="grid" id="gr"></div><div class="fb" id="fb">Coups : 0</div></div>';
  var gr=document.getElementById("gr"),fb=document.getElementById("fb");
  var sym=["🎤","🎟️","💃","🔥","❤️","✨"],cards=shuffle(sym.concat(sym)),open=[],lock=false,moves=0,pairs=0;
  cards.forEach(function(s){

    b.onclick=function(){
      if(lock||b.classList.contains("up")||b.classList.contains("f"))return;

      if(open.length===2){
        moves++;fb.textContent="Coups : "+moves;lock=true;

        if(a[1]===c[1]){

  x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle="#0b0b0d";x.font="italic 600 22px Georgia,serif";x.textAlign="center";x.fillText("Gratte-moi",w/2,h/2+8);

}
function reveal(){
  app.innerHTML='<div class="card"><h1>'+VOEU+' <span class="pink">'+NOM+'</span> ❤</h1><p>Tu as réussi toutes les énigmes. Je t’emmène voir…</p><div class="ticket"><strong>Vitaa &amp; Slimane</strong>LDLC Arena<br>Vendredi 31 mars 2028 · 20h30</div><p class="mut" style="margin-bottom:0">Je t’aime. À nous deux, avec Slimane en prime.</p><div class="nav" style="justify-content:center"><button class="ghost" id="st">↺ Revenir au début</button></div></div>';
  document.getElementById("st").onclick=intro;
  boom();
}
var cv=document.getElementById("cv"),cx=cv.getContext("2d"),P=[];
function size(){cv.width=innerWidth;cv.height=innerHeight;}size();addEventListener("resize",size);
function boom(){
  var c=["#ff4d9d","#d9b36c","#ffffff","#c2185b"];
  for(var i=0;i<160;i++)P.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-2,s:Math.random()*7+3,c:c[i%4],r:Math.random()*6});
  loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.r+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
  P=P.filter(function(p){return p.y<innerHeight+20;});
  if(P.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height);
}
addEventListener("hashchange",function(){location.reload();});
intro();
</script>
